<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Bella Vista Salon{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    >
    <style>
      [data-theme="light"],
      :root:not([data-theme="dark"]) {
        --pico-primary: #42634f;
        --pico-primary-background: #42634f;
        --pico-primary-border: #42634f;
        --pico-primary-hover: #34513f;
        --pico-primary-hover-background: #34513f;
        --pico-primary-hover-border: #34513f;
        --pico-primary-focus: rgba(66, 99, 79, 0.2);
        --pico-primary-inverse: #fff;
      }

      body {
        background-color: #faf8f4;
      }
    </style>
    {% block styles %}{% endblock %}
  </head>
  <body>
    <header class="container">
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="{{ url_for('home') }}"><strong>Bella Vista Salon</strong></a></li>
        </ul>
        <ul>
          <li><a href="{{ url_for('home') }}">Home</a></li>
          <li><a href="{{ url_for('services') }}">Services</a></li>
          <li><a href="{{ url_for('appointment_history') }}">My Appointments</a></li>
        </ul>
      </nav>
    </header>

    <main class="container">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
