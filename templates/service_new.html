{% extends "base.html" %}

{% block title %}New Service | Bella Vista Salon{% endblock %}

{% block styles %}
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/services_admin.css') }}"
  >
{% endblock %}

{% block content %}
  <header class="page-intro">
    <h1>Add New Service</h1>
    <p>Enter the details for a salon service.</p>
  </header>

  <div class="admin-content">
    {% if error %}
      <p role="alert">{{ error }}</p>
    {% endif %}

    <form
      class="service-form"
      action="{{ url_for('create_service') }}"
      method="post"
    >
      <div class="service-fields">
        <div class="form-field">
          <label for="service-name">Service Name</label>
          <input
            type="text"
            id="service-name"
            name="name"
            value="{{ form_data.get('name', '') }}"
            required
          >
        </div>

        <div class="form-field">
          <label for="service-description">Description</label>
          <textarea
            id="service-description"
            name="description"
            rows="3"
            required
          >{{ form_data.get('description', '') }}</textarea>
        </div>

        <div class="form-field">
          <label for="service-duration">Duration (minutes)</label>
          <input
            type="number"
            id="service-duration"
            name="duration_minutes"
            min="1"
            step="1"
            value="{{ form_data.get('duration_minutes', '') }}"
            required
          >
        </div>

        <div class="form-field">
          <label for="service-price">Price ($)</label>
          <input
            type="number"
            id="service-price"
            name="price"
            min="0"
            step="0.01"
            value="{{ form_data.get('price', '') }}"
            required
          >
        </div>
      </div>

      <div class="service-actions">
        <button type="submit">Save Service</button>
        <a href="{{ url_for('services') }}">Back to Services</a>
      </div>
    </form>
  </div>
{% endblock %}
